<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra tu casa en RD | Crear Cuenta</title>
     <link rel="icon" type="image/x-icon" href="assets/icono.ico?v=2">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Hoja de Estilos Principal (asegúrate de que tu styles.css esté en la misma ruta) -->
    <link rel="stylesheet" href="styles.css">
    <style>
      body.login-page-body {
        background-color: #0b0b0b;
        color: #ffffff;
        font-family: 'Inter', sans-serif;
        margin: 0;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        justify-content: center;
        align-items: center;
      }
      .login-card-wrapper {
        width: 100%;
        max-width: 450px;
        padding: 20px;
      }
      .login-box {
        background: #141414;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 40px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      }
      .login-title {
        font-family: 'Poppins', sans-serif;
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 8px;
        text-align: center;
      }
      .login-subtitle {
        color: #888;
        font-size: 14px;
        text-align: center;
        margin-bottom: 30px;
      }
      .input-group {
        margin-bottom: 20px;
      }
      .input-group label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 8px;
        color: #ccc;
      }
      .input-field-wrapper {
        background: #1f1f1f;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        display: flex;
        align-items: center;
        padding: 0 12px;
      }
      .input-field-wrapper input {
        width: 100%;
        background: transparent;
        border: none;
        color: #fff;
        padding: 12px 10px;
        outline: none;
        font-size: 14px;
      }
      .submit-login-btn {
        width: 100%;
        background: #e53e3e;
        color: white;
        border: none;
        padding: 14px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        transition: background 0.2s;
        margin-top: 10px;
      }
      .submit-login-btn:hover {
        background: #c53030;
      }
      .login-footer-text {
        text-align: center;
        margin-top: 25px;
        font-size: 14px;
        color: #888;
      }
      .login-footer-text a {
        color: #3b82f6;
        text-decoration: none;
        font-weight: 500;
      }
    </style>
</head>
<body class="login-page-body">

    <main class="login-card-wrapper">
      <div class="login-box">
        
        <h1 class="login-title">Crear Cuenta</h1>
        <p class="login-subtitle">Regístrate para comenzar a usar la plataforma</p>

        <!-- FORMULARIO DE REGISTRO CON LOCALSTORAGE -->
        <form onsubmit="enviarRegistro(event)">
          
          <div class="input-group">
            <label for="username">Nombre de Usuario</label>
            <div class="input-field-wrapper">
              <input type="text" id="username" placeholder="ej. onlybladi" required>
            </div>
          </div>

          <div class="input-group">
            <label for="email">Correo Electrónico</label>
            <div class="input-field-wrapper">
              <input type="email" id="email" placeholder="tu@email.com" required>
            </div>
          </div>

          <div class="input-group">
            <label for="password">Contraseña</label>
            <div class="input-field-wrapper">
              <input type="password" id="password" placeholder="••••••••" required>
            </div>
          </div>

          <button type="submit" class="submit-login-btn">Registrarse ✨</button>

        </form>

        <div class="login-footer-text">
          <span>¿Ya tienes una cuenta?</span> <a href="login.html">Inicia sesión aquí</a>
        </div>

      </div>
    </main>

    <!-- SCRIPT DE GUARDADO EN LOCALSTORAGE -->
    <script>
      function enviarRegistro(event) {
        event.preventDefault(); // Evita que la página se recargue

        // 1. Capturamos los datos escritos en los inputs
        const nombreIngresado = document.getElementById('username').value.trim();
        const correoIngresado = document.getElementById('email').value.trim();
        const passwordIngresado = document.getElementById('password').value.trim();

        // 2. Creamos el objeto con la información del usuario
        const usuarioData = {
          usuario: nombreIngresado,
          email: correoIngresado,
          password: passwordIngresado
        };

        // 3. Guardamos en el navegador usando localStorage
        localStorage.setItem('usuario_registrado', JSON.stringify(usuarioData));

        // 4. Mensaje de éxito temporal y redirección al login
        alert("¡Cuenta creada con éxito! Ahora puedes iniciar sesión.");
        window.location.href = "login.html";
      }
    </script>

</body>
</html>
