<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta | Compra tu casa en RD</title>
    <link rel="icon" type="image/x-icon" href="../assets/icono.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <style>
      body {
        background-color: #0b0b0e;
        color: #fff;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        margin: 0;
        font-family: 'Inter', sans-serif;
      }

      .site-header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 1000;
        background: rgba(11, 11, 14, 0.95);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .header-inner {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 15px 20px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
      }
      .brand-logo {
        height: 38px;
        width: auto;
        object-fit: contain;
      }

      .registro-hero {
        position: relative;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 120px 20px 60px 20px;
        background: url('../assets/hero-plaza-bandera.jpg') no-repeat center center/cover !important;
      }

      .registro-hero::before {
        content: '';
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.65);
        z-index: 1;
      }

      .registro-card {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 650px;
        background: rgba(18, 18, 20, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 35px;
        box-shadow: 0 25px 50px rgba(0,0,0,0.7);
        backdrop-filter: blur(10px);
      }

      .section-title {
        font-size: 13px;
        color: #3b82f6;
        text-transform: uppercase;
        font-weight: 700;
        letter-spacing: 1px;
        margin-top: 20px;
        margin-bottom: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 6px;
      }

      .form-row {
        display: flex;
        gap: 15px;
      }

      .form-group {
        margin-bottom: 15px;
        flex: 1;
      }

      .form-group label {
        display: block;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 6px;
        color: #d4d4d8;
      }

      .form-control {
        width: 100%;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 11px 14px;
        border-radius: 12px;
        color: #fff;
        font-size: 14px;
        outline: none;
        transition: all 0.3s ease;
        box-sizing: border-box;
      }

      select.form-control {
        color: #ffffff;
        background-color: #18181b;
      }

      select.form-control option {
        background-color: #18181b;
        color: #ffffff;
        padding: 10px;
      }

      .form-control:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        background: rgba(255, 255, 255, 0.08);
      }

      .btn-submit {
        width: 100%;
        background: #3b82f6;
        color: #fff;
        border: none;
        padding: 13px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
        margin-top: 15px;
      }

      .btn-submit:hover {
        background: #2563eb;
        transform: translateY(-2px);
      }

      .site-footer {
        background: #0b0b0e;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        padding: 30px 20px;
        color: #a1a1aa;
        text-align: center;
        position: relative;
        z-index: 2;
      }
      .footer-container { max-width: 1200px; margin: 0 auto; }
      .highlight-red { color: #ef4444; }
    </style>
</head>
<body>

    <header class="site-header">
      <div class="header-inner">
        <a href="../index.html" class="brand">
          <img src="../assets/mi-logo.png" alt="Compra tu casa en RD" class="brand-logo">
        </a>
        <nav class="main-nav" style="display: flex; gap: 20px;">
          <a href="../index.html" class="nav-link" style="color: #fff; text-decoration: none; font-size: 14px;">🏠 Inicio</a>
          <a href="../propiedades.html" class="nav-link" style="color: #fff; text-decoration: none; font-size: 14px;">🏢 Propiedades</a>
          <a href="../comunidad.html" class="nav-link" style="color: #fff; text-decoration: none; font-size: 14px;">👥 Comunidad</a>
        </nav>
      </div>
    </header>

    <div class="registro-hero">
      <div class="registro-card">
        <form id="formCrearCuenta">
          
          <div class="section-title" style="margin-top: 0;">2. Información Personal</div>
          <div class="form-row">
            <div class="form-group">
              <label for="nombres">Nombres *</label>
              <input type="text" id="nombres" class="form-control" placeholder="Tus nombres" required>
            </div>
            <div class="form-group">
              <label for="apellidos">Apellidos *</label>
              <input type="text" id="apellidos" class="form-control" placeholder="Tus apellidos" required>
            </div>
          </div>

          <div class="form-group">
            <label for="telefono">Teléfono / Celular *</label>
            <div style="display: flex; gap: 10px;">
              <select class="form-control" style="width: 130px;" id="prefijoPais">
                <option value="DO +1">DO +1 (RD)</option>
              </select>
              <input type="text" id="telefono" class="form-control" placeholder="809 000 0000" required>
            </div>
          </div>

          <div class="section-title">3. Ubicación</div>
          <div class="form-row">
            <div class="form-group">
              <label for="provincia">Provincia / Ciudad *</label>
              <input type="text" id="provincia" class="form-control" placeholder="Ej. Santo Domingo" required>
            </div>
            <div class="form-group">
              <label for="sector">Sector / Sector Residencial *</label>
              <input type="text" id="sector" class="form-control" placeholder="Ej. Piantini" required>
            </div>
          </div>

          <div class="section-title">4. Tipo de Perfil Deseado</div>
          <div class="form-group">
            <label for="tipoRol">Selecciona tu rol en la plataforma *</label>
            <select id="tipoRol" class="form-control" required>
              <option value="cliente">Cliente / Buscador de Propiedades (Gratis)</option>
              <option value="agente">Agente Inmobiliario (Requiere Membresía)</option>
              <option value="agentepro">Agente Pro (Requiere Membresía)</option>
            </select>
          </div>

          <div class="form-group" style="margin-top: 15px;">
            <label for="email">Correo electrónico *</label>
            <input type="email" id="email" class="form-control" placeholder="correo@domain.com" required>
          </div>

          <div class="form-group">
            <label for="password">Contraseña *</label>
            <input type="password" id="password" class="form-control" placeholder="Mínimo 6 caracteres" required>
          </div>

          <button type="submit" class="btn-submit" id="btnRegistrar">Registrarse y Acceder ➔</button>

          <p style="text-align: center; font-size: 13px; color: #a1a1aa; margin-top: 15px;">
            ¿Ya tienes una cuenta? <a href="login.html" style="color: #3b82f6; text-decoration: none;">Inicia sesión aquí</a>
          </p>

        </form>
      </div>
    </div>

    <footer class="site-footer">
      <div class="footer-container">
        <h2 style="font-size: 16px; font-weight: 800; color: #fff; margin-bottom: 6px;">Compra tu casa en <span class="highlight-red">RD</span></h2>
        <p style="font-size: 12px;">© 2026 Compra tu casa en RD. Todos los derechos reservados.</p>
      </div>
    </footer>

    <script type="module">
      import { auth, db } from '../firebase-config.js';
      import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
      import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

      const form = document.getElementById('formCrearCuenta');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const rol = document.getElementById('tipoRol').value;
        const nombres = document.getElementById('nombres').value;
        const apellidos = document.getElementById('apellidos').value;

        try {
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          const user = userCredential.user;

          await setDoc(doc(db, "usuarios", user.uid), {
            nombres,
            apellidos,
            email,
            rol,
            fechaCreacion: new Date().toISOString()
          });

          if (rol === 'agente' || rol === 'agentepro') {
            window.location.href = `Membresía.html?rol=${rol}`;
          } else {
            window.location.href = '../index.html';
          }
        } catch (error) {
          alert("Error al crear cuenta: " + error.message);
        }
      });
    </script>
</body>
</html>
